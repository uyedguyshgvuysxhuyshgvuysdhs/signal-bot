name: Bot de signaux

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21h30 UTC, du lundi au vendredi, après la clôture de Wall Street
  workflow_dispatch:           # bouton « Run workflow » pour le lancer à la main

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lancer le bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SITE_DIR: docs
        run: python bot_signaux.py
      - name: Garder la mémoire des alertes déjà envoyées
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add signaux_envoyes.json || true
          git diff --staged --quiet || (git commit -m "État des alertes" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: bot
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.site.outputs.page_url }}
    steps:
      - id: site
        uses: actions/deploy-pages@v4

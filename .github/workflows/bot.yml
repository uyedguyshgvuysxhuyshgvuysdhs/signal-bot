name: Bot de signaux

on:
  schedule:
    - cron: "*/15 13-21 * * 1-5"   # toutes les 15 min, du lundi au vendredi, pendant les heures de Wall Street (UTC)
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer un message de test dans les 3 salons Discord"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lancer le bot
        env:
          DISCORD_WEBHOOK_OUVERTURE: ${{ secrets.DISCORD_WEBHOOK_OUVERTURE }}
          DISCORD_WEBHOOK_FERMETURE: ${{ secrets.DISCORD_WEBHOOK_FERMETURE }}
          DISCORD_WEBHOOK_ALERTES: ${{ secrets.DISCORD_WEBHOOK_ALERTES }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SITE_DIR: docs
        run: python bot_signaux.py ${{ inputs.test && '--test' || '--auto' }}
      - name: Garder la mémoire des alertes déjà envoyées
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add signaux_envoyes.json || true
          git diff --staged --quiet || (git commit -m "État des alertes" && git pull --rebase && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: bot
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.site.outputs.page_url }}
    steps:
      - id: site
        uses: actions/deploy-pages@v4
